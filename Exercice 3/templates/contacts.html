<!DOCTYPE html>
<html>
<head>
    <title>Contacts</title>
</head>
<body>
    <h1>Liste des contacts</h1>

    <ul>
        {% for contact in contacts %}
            <li>{{ contact.name }} - {{ contact.email }}</li>
        {% endfor %}
    </ul>

    <a href="/">Ajouter un autre contact</a>
</body>
</html>
