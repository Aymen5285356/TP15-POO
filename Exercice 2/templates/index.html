<!DOCTYPE html>
<html>
<head>
    <title>Conversion</title>
</head>
<body>
    <h1>Convertir Celsius → Fahrenheit</h1>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="celsius" placeholder="Température en °C">
        <button type="submit">Convertir</button>
    </form>
</body>
</html>
